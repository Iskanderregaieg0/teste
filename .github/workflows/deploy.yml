name: CI/CD - Déploiement Flink Pipeline

on:
  push:
    branches:
      - bi-pipeline  # ← Branche ciblée

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Cloner le dépôt
        uses: actions/checkout@v3

      - name: 🔐 Ajouter la clé SSH pour accéder à l’EC2
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 52.47.196.93 >> ~/.ssh/known_hosts

      - name: 📡 Copier les fichiers vers l’EC2
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@52.47.196.93 'mkdir -p ~/deploy-flink'
          scp -i ~/.ssh/id_rsa -r ./* ubuntu@52.47.196.93:~/deploy-flink/

      - name: 🧪 Vérifier et relancer les conteneurs si nécessaire
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@52.47.196.93 <<'EOF'
            cd ~/deploy-flink
            running=$(docker ps -q | wc -l)
            total=$(docker-compose ps -q | wc -l)

            echo "🟡 Conteneurs actifs: $running / $total"

            if [ "$running" -lt "$total" ]; then
              echo "⚠️ Des conteneurs ne sont pas actifs, relance en cours..."
              docker-compose up -d
            fi

            echo "⏳ Attente du démarrage complet..."
            tries=0
            max=10
            while [ "$(docker ps -q | wc -l)" -lt "$total" ]; do
              tries=$((tries+1))
              echo "⏳ Tentative $tries/$max..."
              sleep 5
              if [ "$tries" -ge "$max" ]; then
                echo "❌ Timeout : certains conteneurs ne démarrent pas"
                exit 1
              fi
            done

            echo "✅ Tous les conteneurs sont actifs."
          EOF

      - name: 🚀 Lancer le script de déploiement
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@52.47.196.93 'cd ~/deploy-flink && chmod +x deploy.sh && ./deploy.sh'
