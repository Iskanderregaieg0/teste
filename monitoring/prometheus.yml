scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'flink'
    static_configs:
      - targets: ['flink-jobmanager:9250']

  - job_name: 'flink-taskmanager'
    static_configs:
      - targets: ['flink-taskmanager:9251']
      
  - job_name: 'postgres_exporter'
    static_configs:
      - targets: ['postgres_exporter:9187']
